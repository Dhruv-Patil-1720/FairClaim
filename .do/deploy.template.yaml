spec:
  name: fairclaim
  services:
    - name: web
      environment_slug: node-js
      github:
        repo: Dhruv-Patil-1720/FairClaim
        branch: main
        deploy_on_push: true
      build_command: npm run build
      run_command: npm start
      http_port: 8080
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-0.5gb
      envs:
        - key: PORT
          scope: RUN_TIME
          value: "8080"
        - key: GEMINI_API_KEY
          scope: RUN_TIME
          type: SECRET
